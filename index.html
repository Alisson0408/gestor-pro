<script>
// ============ BASE ============
const $=s=>document.querySelector(s);
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
const D=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const DD=t=>new Date(t+'T12:00').toLocaleDateString('pt-BR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date((iso||today())+'T12:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast show'+(err?' err':'');clearTimeout(t._);t._=setTimeout(()=>t.className='toast',3200);return false}
function modal(html){$('#mbox').style.width='';$('#mbox').innerHTML=html;$('#modal').classList.add('show')}

function traduz(m){return m.replace('Invalid login credentials','E-mail ou senha incorretos').replace('User already registered','Este e-mail já tem conta. Faça login.').replace('Email not confirmed','Confirme seu e-mail antes de entrar (veja sua caixa de entrada).').replace(/Password should be at least (\d+) characters?.*/,'A senha precisa ter pelo menos $1 caracteres').replace('Unable to validate email address: invalid format','E-mail inválido')}

async function carregarSessao(){
  if(!sb)return telaConfig();
  const {data:{session}}=await sb.auth.getSession();
  S.user=session?session.user:null;
  if(!S.user)return telaLogin();
  try{
    const [mem,adm]=await Promise.all([
      q(sb.from('membros').select('papel,empresa_id,empresas(*)').eq('user_id',S.user.id)),
      q(sb.from('admins').select('user_id').eq('user_id',S.user.id))
    ]);
    S.admin=adm.length>0;
    if(S.admin){try{S.avisosN=(await rpc('admin_avisos')).length;if(S.avisosN)setTimeout(()=>toast('🔔 '+S.avisosN+' aviso(s) de pagamento — veja no Admin'),900)}catch(e){S.avisosN=0}}
    S.empresas=mem.filter(m=>m.empresas).map(m=>({...m.empresas,papel:m.papel})).sort((a,b)=>a.nome.localeCompare(b.nome));
    let pref=null;try{pref=localStorage.getItem('gp_emp')}catch(e){}
    const esc_=S.empresas.find(x=>x.id===pref)||S.empresas.find(ativa)||S.empresas[0];
    if(esc_){S.empresa=esc_;S.papel=esc_.papel}else{S.papel=null;S.empresa=null}
  }catch(e){erro(e)}
  if(!S.empresa){if(S.admin){S.view='admin';return montarApp()}return telaOnboarding()}
  if(!ativa(S.empresa)&&!S.admin)return telaBloqueio();
  if(!ativa(S.empresa)&&S.admin){S.view='admin';return montarApp()}
  await recarregar();montarApp();
}
async function trocarEmpresa(id){
  const e=(S.empresas||[]).find(x=>x.id===id);if(!e)return;
  try{localStorage.setItem('gp_emp',id)}catch(er){}
  S.empresa=e;S.papel=e.papel;S.cart=[];S.busca='';S.pdvF={desc:0,pg:/laborat/i.test(e.nome||'')?'Fiado':'PIX',cli:'',conta:null,venc:'',pac:'',fic:'',ent:''};S.rs={cli:'',de:'',ate:''};S.caixaDia=null;S.precSel={};S.etq.qtd={};S.buscaCad='';S.hBusca='';S.bProd='';S.bEst='';if(S.osF)S.osF.b='';S.hDe=S.hAte='';S.view='painel';
  if(!ativa(e)&&!S.admin)return telaBloqueio();
  if(!ativa(e)&&S.admin){S.view='admin';return montarApp()}
  try{await recarregar()}catch(er){return erro(er)}
  montarApp();toast('Você está em: '+e.nome);
}

async function recarregar(){
  const desde=new Date(Date.now()-62*864e5).toISOString();
  const [prods,vendas]=await Promise.all([
    q(sb.from('produtos').select('*').eq('empresa_id',S.empresa.id).eq('ativo',true).order('nome')),
    q(sb.from('vendas').select('*,venda_itens(*)').eq('empresa_id',S.empresa.id).gte('data',desde).order('data',{ascending:false}))
  ]);
  S.produtos=prods.map(p=>({...p,custo:+p.custo,preco:+p.preco,estoque:+p.estoque,minimo:+p.minimo}));
  S.vendas=vendas.map(normVenda);
  const eid=S.empresa.id;
  const [cli,forn,contas]=await Promise.all([
    q(sb.from('clientes').select('*').eq('empresa_id',eid).eq('ativo',true).order('nome')),
    q(sb.from('fornecedores').select('*').eq('empresa_id',eid).eq('ativo',true).order('nome')),
    q(sb.from('contas_bancarias').select('*').eq('empresa_id',eid).eq('ativo',true).order('nome'))
  ]);
  S.clientes=cli;S.fornecedores=forn;S.contas=contas.map(c=>({...c,saldo_inicial:+c.saldo_inicial}));
  try{const [ls,pp]=await Promise.all([q(sb.from('listas_preco').select('numero,nome').eq('empresa_id',eid).order('numero')),q(sb.from('produto_precos').select('produto_id,lista,preco').eq('empresa_id',eid).limit(10000))]);
    S.listas=ls||[];S.pp={};(pp||[]).forEach(r=>{(S.pp[r.produto_id]=S.pp[r.produto_id]||{})[r.lista]=+r.preco})}catch(e){S.listas=[];S.pp={}}
  if(!MULTI()&&!S.contas.some(c=>c.tipo==='caixa')&&dono()){try{const c=await q(sb.from('contas_bancarias').insert({empresa_id:eid,nome:'Caixa',banco:'Caixa da empresa',tipo:'caixa',saldo_inicial:0}).select().single());S.contas.push({...c,saldo_inicial:+c.saldo_inicial})}catch(e){console.warn(e)}}
  if(dono()){
    const [ab,sal]=await Promise.all([
      q(sb.from('lancamentos').select('*').eq('empresa_id',eid).eq('pago',false).order('vencimento')),
      rpc('saldos_contas',{p_empresa:eid})
    ]);
    S.abertos=ab.map(l=>({...l,valor:+l.valor}));S.saldos={};(sal||[]).forEach(s=>S.saldos[s.conta_id]={saldo:+s.saldo,ent:+s.entradas_mes,sai:+s.saidas_mes});
  }
}

// ---- Pagamento por Pix (a chave vem do banco, não fica no código)
const _pf=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function _crc16(t){let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixPayload(x,valor){let p=_pf('00','01')+_pf('26',_pf('00','br.gov.bcb.pix')+_pf('01',x.chave))+_pf('52','0000')+_pf('53','986')+(valor?_pf('54',Number(valor).toFixed(2)):'')+_pf('58','BR')+_pf('59',x.nome.slice(0,25))+_pf('60',x.cidade.slice(0,15))+_pf('62',_pf('05','***'))+'6304';return p+_crc16(p)}
async function pixInfo(){if(!S.pix){try{S.pix=await rpc('pix_info')}catch(e){S.pix=null}}return S.pix}
function pixCard(){setTimeout(pixMontar,0);return `<div id="pixcard" class="pixcard"><div class="pixload">Carregando Pix…</div></div>`}
async function pixMontar(){const el=document.getElementById('pixcard');if(!el)return;const x=await pixInfo();
  if(!x){el.innerHTML='<div class="pixload">Pix indisponível no momento. Fale conosco pelo WhatsApp.</div>';return}
  const code=pixPayload(x);S._pixCode=code;let qr='';try{const q=qrcode(0,'M');q.addData(code);q.make();qr=q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){}
  el.innerHTML=`<div class="pixtop"><span class="pixlogo">◆ PIX</span><span class="pixtag">Sem taxas</span></div>
   <div class="pixfav"><small>Favorecido</small><b>${esc(x.exibir)}</b></div>
   ${qr?`<div class="pixqr">${qr}</div><p class="pixhint">Abra o app do seu banco → Pix → <b>Ler QR Code</b></p>`:''}
   <button class="btn p pixbtn" onclick="pixCopiar('code',this)">📋 Copiar Pix Copia e Cola</button>
   <button class="btn pixbtn2" onclick="pixCopiar('chave',this)">🔑 Copiar chave Pix</button>
   <div id="pixav"></div>`;pixStatus()}
async function pixStatus(){const el=document.getElementById('pixav');if(!el||!S.empresa)return;let a=null;try{a=await rpc('meu_aviso_pendente',{p_empresa:S.empresa.id})}catch(e){}

async function pixCopiar(t,b){const x=await pixInfo();if(!x)return;const v=t==='code'?S._pixCode:x.chave;
  try{await navigator.clipboard.writeText(v)}catch(e){const a=document.createElement('textarea');a.value=v;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  const o=b.innerHTML;b.innerHTML='✅ Copiado!';setTimeout(()=>b.innerHTML=o,1800);toast(t==='code'?'Pix Copia e Cola copiado — cole no app do banco':'Chave Pix copiada')}

function pdvCodigo(c){
  c=String(c||'').trim();if(!c)return;
  const lo=x=>String(x||'').trim().toLowerCase(),nz=x=>lo(x).replace(/^0+/,'');
  let p=S.produtos.find(x=>x.codigo&&lo(x.codigo)===lo(c))||S.produtos.find(x=>x.codigo&&nz(x.codigo)&&nz(x.codigo)===nz(c));
  if(!p){const l=S.produtos.filter(x=>x.ativo!==false&&lo(x.nome).includes(lo(c)));if(l.length===1)p=l[0]}
  if(p){add(p.id);S.busca='';S._refocus='bp';render()}
  else{S.busca=c;S._refocus='bp';render();toast('Código "'+c+'" não encontrado. Confira o código no cadastro do produto.',1)}
}
(function(){let buf='',t0=0;
  document.addEventListener('keydown',e=>{
    if(S.view!=='pdv'||e.ctrlKey||e.altKey||e.metaKey)return;
    const a=document.activeElement,tag=a&&a.tagName;
    if(a&&a.id==='bp')return;

    const now=Date.now();if(now-t0>80)buf='';t0=now;
    if(e.key==='Enter'){if(buf.length>=3){e.preventDefault();const c=buf;buf='';pdvCodigo(c)}return}
    if(e.key.length===1)buf+=e.key;
  },true);
})();
function add(id){const p=P(id);const i=S.cart.find(x=>x.produto_id===id);const qn=(i?i.qtd:0)+1;if(!servico(p)&&qn>p.estoque){if(!semEst())return toast('Sem estoque suficiente de '+p.nome,1);toast('Atenção: '+p.nome+' sem estoque no sistema. A venda vai deixar o estoque negativo — lance a entrada depois.',1)}if(i)i.qtd++;else S.cart.push({produto_id:id,nome:p.nome,qtd:1,preco:precoP(p,S.pdvF.cli)});S._focus=0;render()}
function qt(ix,d){const i=S.cart[ix];const p=P(i.produto_id);i.qtd+=d;if(p&&!servico(p)&&i.qtd>p.estoque&&!semEst()){i.qtd=p.estoque;toast('Limite do estoque',1)}if(i.qtd<=0)S.cart.splice(ix,1);S._focus=0;render()}
function finalizar(b,conferido){
  if(!S.cart.length)return toast('Carrinho vazio',1);
  if(!conferido){const r=checaVenda();if(r.a.length)return dupModal(r,'Esta venda parece repetida',()=>finalizar($('#bf'),1))}
  busy(b,async()=>{
    const F=S.pdvF,fiado=F.pg==='Fiado';
    if(fiado&&!F.cli)return toast('Escolha ou cadastre o cliente para vender fiado',1);
    const r=await rpc('registrar_venda',{p_empresa:S.empresa.id,p_itens:S.cart.map(i=>({produto_id:i.produto_id,qtd:i.qtd,preco:+i.preco})),p_desconto:+F.desc||0,p_pagamento:F.pg,p_cliente:null,
      p_cliente_id:F.cli||null,p_conta:fiado?null:(F.conta||null),p_vencimento:fiado?(F.venc||vencPadrao()):null,p_paciente:F.pac||null,p_ficha:F.fic||null,p_entrada:F.ent||null});
    if(F.os){try{const o=(await q(sb.from('ordens_servico').select('numero,componentes,componentes_baixados').eq('id',F.os)))[0];let falhas=[];
      if(o&&!o.componentes_baixados){for(const c of (o.componentes||[]).filter(c=>!c.cobrar)){try{await rpc('registrar_saida',{p_produto:c.produto_id,p_qtd:+c.qtd,p_motivo:'Uso na OS '+o.numero,p_obs:null})}catch(e){falhas.push((P(c.produto_id)||{}).nome||'componente')}}}
      await q(sb.from('ordens_servico').update({status:'entregue',venda_id:r.id,componentes_baixados:true}).eq('id',F.os));
      if(falhas.length)setTimeout(()=>toast('Sem estoque para dar baixa em: '+falhas.join(', ')+'. Lance a saída manualmente.',1),1500)}catch(e){}}
    S.cart=[];S.busca='';S.pdvF={...S.pdvF,desc:0,cli:'',venc:'',pac:'',fic:'',ent:'',os:null};await recarregar();render();cupom(r.id);toast('Venda #'+r.numero+' registrada');
  });
}
async function cupom(id){
  let v=S.vendas.find(x=>x.id===id);
  if(!v){try{v=normVenda((await q(sb.from('vendas').select('*,venda_itens(*)').eq('id',id)))[0])}catch(e){return erro(e)}}
  modal(`<h3>🧾 Venda #${v.numero} ${v.cancelada?'<span class="tag t-bad">Cancelada</span>':'<span class="tag t-ok">Concluída</span>'}</h3><p style="color:var(--muted);margin-bottom:10px">${D(v.data)} · ${esc(v.pagamento)}${v.cliente?' · '+esc(v.cliente):''}${v.paciente?'<br>Paciente: <b>'+esc(v.paciente)+'</b>':''}${v.ficha?' · Ficha '+esc(v.ficha):''}</p>
  <div class="tw"><table><tr><th>Item</th><th class="num">Qtd</th><th class="num">Unit.</th><th class="num">Total</th></tr>${v.itens.map(i=>`<tr><td>${esc(i.nome)}</td><td class="num">${N(i.qtd)}</td><td class="num">${R(i.preco)}</td><td class="num">${R(i.qtd*i.preco)}</td></tr>`).join('')}</table></div>
  <div class="row" style="margin-top:12px"><span class="sp"></span><div style="text-align:right">${v.desconto?`<div style="color:var(--muted)">Desconto: −${R(v.desconto)}</div>`:''}<div class="total" style="margin:4px 0">${R(v.total)}</div></div></div>
  <div class="row">${!v.cancelada&&dono()?`<button class="btn d" onclick="fechar();confirmar('Cancelar a venda #${v.numero}? Os produtos voltam para o estoque.',()=>cancelar('${v.id}'))">Cancelar venda</button>`:''}<button class="btn" onclick="copiarCupom('${v.id}')">📋 Copiar p/ WhatsApp</button><button class="btn" onclick="fechar();relFicha('${v.id}')">📄 Relatório / PDF</button><span class="sp"></span><button class="btn p" onclick="fechar()">Fechar</button></div>`);
  S._cupom=v;
}
function copiarCupom(){const v=S._cupom;const t=`*${S.empresa.nome}*\nVenda #${v.numero} — ${D(v.data)}\n\n${v.itens.map(i=>`${N(i.qtd)}x ${i.nome} — ${R(i.qtd*i.preco)}`).join('\n')}\n${v.desconto?'\nDesconto: -'+R(v.desconto):''}\n*Total: ${R(v.total)}*\nPagamento: ${v.pagamento}\n\nObrigado pela preferência!`;navigator.clipboard.writeText(t).then(()=>toast('Cupom copiado! Cole no WhatsApp do cliente.'),()=>toast('Não foi possível copiar',1))}
async function cancelar(id){try{await rpc('cancelar_venda',{p_venda:id});await recarregar();toast('Venda cancelada e estoque estornado');render()}catch(e){erro(e)}}

// ---- Produtos
// busca por nome, código ou descrição (sem diferença de acento/maiúscula; várias palavras)
const casaBusca=(p,b)=>{const t=normTxt([p.nome,p.codigo,p.descricao,p.categoria].filter(Boolean).join(' '));return normTxt(b).split(/\s+/).filter(Boolean).every(w=>t.includes(w))};
const caixaBusca=(id,k,ph)=>`<input id="${id}" placeholder="${ph}" value="${esc(S[k]||'')}" autocomplete="off" oninput="S.${k}=this.value;clearTimeout(S._bt);S._bt=setTimeout(()=>{S._refocus='${id}';render()},250)" style="margin-bottom:12px">`;
VIEWS.produtos=()=>`<div class="row"><div><h1>Produtos</h1><p class="sub">Cadastre seus produtos com custo, preço de venda e estoque mínimo.</p></div><span class="sp"></span><button class="btn" onclick="S.etq.qtd={};go('etiquetas')">🏷️ Etiquetas</button><button class="btn p" onclick="formProd()">+ Novo produto</button></div>
  <div class="card tw">${caixaBusca('bprod','bProd','🔎 Buscar produto por nome ou código...')}${S.bProd?`<div style="color:var(--muted);font-size:13px;margin:-4px 0 10px">${S.produtos.filter(p=>casaBusca(p,S.bProd)).length} produto(s) encontrado(s) · <a href="#" onclick="S.bProd='';render();return false">limpar busca</a></div>`:''}<table><tr><th>Código</th><th>Produto</th><th>Categoria</th><th class="num">Custo</th><th class="num">Preço</th><th class="num">Margem</th><th class="num">Estoque</th><th></th></tr>
  ${S.produtos.filter(p=>!S.bProd||casaBusca(p,S.bProd)).map(p=>{const mg=p.preco?((p.preco-p.custo)/p.preco*100):0;return `<tr><td style="color:var(--muted)">${esc(p.codigo)}</td><td><b>${esc(p.nome)}</b>${p.descricao?`<div style="color:var(--muted);font-size:12px">${esc(p.descricao)}</div>`:''}</td><td>${esc(p.categoria)}</td><td class="num">${R(p.custo)}</td><td class="num">${R(p.preco)}</td><td class="num"><span class="tag ${mg<20?'t-warn':'t-ok'}">${mg.toFixed(0)}%</span></td><td class="num">${repor(p)?`<span class="tag t-bad">${N(p.estoque)} ${esc(p.unidade)}</span>`:N(p.estoque)+' '+esc(p.unidade)}</td><td class="num" style="white-space:nowrap"><button class="btn sm" title="Imprimir etiqueta" onclick="S.etq.qtd={'${p.id}':1};go('etiquetas')">🏷️</button> <button class="btn sm" onclick="formProd('${p.id}')">Editar</button></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Nenhum produto cadastrado ainda</td></tr>'}</table></div>`;
function formProd(id){
  const p=id?P(id):{codigo:'',nome:'',categoria:ehLab()?'Serviço - Prótese':'',unidade:'un',custo:'',preco:'',minimo:0};
  modal(`<h3>${id?'Editar':'Novo'} produto</h3><form id="fp" class="f" style="grid-template-columns:1fr 1fr">
  <div><label>Código do produto</label><input name="codigo" placeholder="Ex.: 10CM16383SG" value="${esc(p.codigo)}"></div>
  <div><label>Unidade</label><select name="unidade">${['un','kg','g','l','ml','cx','pct','m'].map(u=>`<option ${u===p.unidade?'selected':''}>${u}</option>`).join('')}</select></div>
  <div style="grid-column:span 2"><label>Nome do produto * <span style="font-weight:500">(1ª linha da etiqueta)</span></label><input name="nome" required placeholder="Ex.: UCLA CM 3.8" value="${esc(p.nome)}"></div>
  <div style="grid-column:span 2"><label>Especificação <span style="font-weight:500">(2ª linha da etiqueta)</span></label><input name="descricao" placeholder="Ex.: ALT 3 EPIKUT 16°" value="${esc(p.descricao||'')}"></div>
  <div><label>Categoria</label><input name="categoria" list="dlcat" value="${esc(p.categoria)}"><datalist id="dlcat">${[...new Set(S.produtos.map(x=>(x.categoria||'').trim()).filter(Boolean))].sort().map(c=>`<option value="${esc(c)}">`).join('')}</datalist><div style="color:var(--muted);font-size:12px;margin-top:4px">Para aparecer na ficha (Ordem de Serviço), a categoria precisa começar com <b>Serviço</b>.</div></div>
  <div><label>Estoque mínimo <span style="font-weight:500">(0 = padrão: ${CONFIG.ALERTA_ESTOQUE||10})</span></label><input name="minimo" type="number" min="0" step="any" value="${p.minimo}"></div>
  <div><label>Preço de custo (R$)</label><input name="custo" type="number" min="0" step="0.01" value="${id?(+p.custo).toFixed(2):''}"></div>
  <div><label>Preço de venda (R$) *</label><input name="preco" type="number" min="0" step="0.01" required value="${p.preco}"></div>
  ${id?'<p style="grid-column:span 2;color:var(--muted);font-size:12px">O estoque só muda por Entradas, Saídas e Vendas — assim tudo fica registrado.</p>':'<div style="grid-column:span 2"><label>Estoque inicial</label><input name="estoque" type="number" min="0" step="any" value="0"></div>'}
  ${listasUsadas().length?`<div style="grid-column:span 2;border-top:1px solid var(--line);padding-top:10px"><label>Preço por tabela <span style="font-weight:400;color:var(--muted)">(em branco = usa o preço de venda)</span></label><div class="f" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:6px">${listasUsadas().map(l=>`<div><label style="font-size:12px">${l.numero} - ${esc(l.nome)}</label><input name="lp_${l.numero}" type="number" step="0.01" min="0" inputmode="decimal" value="${id&&S.pp[id]&&S.pp[id][l.numero]?S.pp[id][l.numero].toFixed(2):''}"></div>`).join('')}</div></div>`:''}
  <div class="row" style="grid-column:span 2;margin-top:6px">${id?`<button type="button" class="btn d" onclick="delProd('${id}')">Excluir</button>`:''}<span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bs">Salvar</button></div></form>`);
  $('#fp').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    const d={codigo:f.codigo.trim()||null,nome:f.nome.trim(),descricao:f.descricao.trim()||null,categoria:f.categoria.trim()||null,unidade:f.unidade,custo:+f.custo||0,preco:+f.preco||0,minimo:+f.minimo||0};
    if(!dupBox(e.target,checaProd(d,id)))return;
    busy($('#bs'),async()=>{
      let pid=id;
      if(id)await q(sb.from('produtos').update(d).eq('id',id));
      else{const np=await q(sb.from('produtos').insert({...d,empresa_id:S.empresa.id}).select().single());pid=np.id;if(+f.estoque>0)await rpc('registrar_entrada',{p_produto:np.id,p_qtd:+f.estoque,p_custo:d.custo||null,p_obs:'Estoque inicial'})}
      for(const l of listasUsadas()){const v=+f['lp_'+l.numero]||0,old=pid&&S.pp[pid]&&S.pp[pid][l.numero];
        if(v>0&&v!==old)await q(sb.from('produto_precos').upsert({empresa_id:S.empresa.id,produto_id:pid,lista:+l.numero,preco:v},{onConflict:'produto_id,lista'}));
        else if(!(v>0)&&old)await q(sb.from('produto_precos').delete().eq('produto_id',pid).eq('lista',+l.numero))}
      await recarregar();fechar();toast('Produto salvo');render();
    });
  };
}
function delProd(id){fechar();confirmar('Excluir este produto? O histórico de vendas é mantido.',async()=>{try{await q(sb.from('produtos').update({ativo:false}).eq('id',id));await recarregar();toast('Produto excluído');render()}catch(e){erro(e)}})}

  <div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn p" onclick="fechar()">Fechar</button></div>`);
  $('#mbox').style.width='min(900px,96vw)';
}catch(e){erro(e)}}

// ============ PROTEÇÃO CONTRA DUPLICIDADE ============
// b = bloqueios (não deixa salvar) · a = avisos (só salva depois de marcar "Conferi e não é duplicado")
const nfNums=t=>{const r=[],re=/\bN(?:F|OTA)(?:[\s\-]*E)?(?:\s*FISCAL)?[\s.:º°nN\-]*0*(\d{1,9})\b/gi;let m;const s=String(t||'').toUpperCase();while((m=re.exec(s)))r.push(m[1]);return [...new Set(r)]};
const temNF=(txt,n)=>nfNums(txt).includes(String(+n));
const ha=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4);return m<1?'agora mesmo':m<60?`há ${m} min`:m<1440?`há ${Math.round(m/60)} h`:`em ${new Date(iso).toLocaleDateString('pt-BR')}`};
function dupBox(form,res){
  let box=form.querySelector('.dupx');
  if(!res.b.length&&!res.a.length){if(box)box.remove();return true}
  if(!box){box=document.createElement('div');box.className='dupx';box.style.gridColumn='1/-1';form.lastElementChild.before(box)}
  if(res.b.length){box.dataset.k='';box.innerHTML=`<div class="dupbloq"><b>⛔ Bloqueado — isto já está lançado</b>${res.b.map(x=>`<div>• ${x}</div>`).join('')}<div class="dupmut">Para evitar duplicidade o sistema não deixa salvar. Se precisar corrigir algo, abra o registro que já existe.</div></div>`;box.scrollIntoView({block:'nearest'});toast('Bloqueado: já existe um registro igual',1);return false}
  const k=JSON.stringify(res.a),ck=box.querySelector('.dupok');
  if(box.dataset.k===k&&ck&&ck.checked)return true;
  box.dataset.k=k;box.innerHTML=`<div class="dupav"><b>⚠️ Atenção — confira antes de salvar (possível duplicidade ou erro)</b>${res.a.map(x=>`<div>• ${x}</div>`).join('')}<label class="dupchk"><input type="checkbox" class="dupok"> Conferi: está correto e <u>não</u> é duplicado — quero salvar</label></div>`;
  box.scrollIntoView({block:'nearest'});toast('Confira o aviso de duplicidade antes de salvar',1);return false;
}
function dupModal(res,titulo,seguir){
  if(res.b.length){modal(`<div class="dupbloq" style="margin:0"><b style="font-size:16px">⛔ ${titulo||'Lançamento bloqueado'}</b>${res.b.map(x=>`<div>• ${x}</div>`).join('')}<div class="dupmut">Para evitar duplicidade o sistema não deixa lançar de novo.</div></div><div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn p" onclick="fechar()">Entendi</button></div>`);return}

  if(doc&&doc.length!==11&&doc.length!==14)res.a.push(`O CPF/CNPJ informado tem ${doc.length} números (CPF tem 11 e CNPJ tem 14). Confira se foi digitado certo.`);

// ---- Importar XML de NF-e (entrada de compras)
const soDig=v=>String(v||'').replace(/\D/g,'');
const fmtDoc=v=>{const d=soDig(v);return d.length===14?d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):d.length===11?d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4'):(v||'')};
const fmtFone=v=>{const d=soDig(v);return d.length===10?d.replace(/^(\d{2})(\d{4})(\d{4})$/,'($1) $2-$3'):d.length===11?d.replace(/^(\d{2})(\d{5})(\d{4})$/,'($1) $2-$3'):(v||'')};
const normTxt=v=>String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim().toUpperCase();
const UNID_NFE=u=>{u=normTxt(u);if(/^(KG|KGS|QUILO)/.test(u))return 'kg';if(/^(G|GR|GRAMA)/.test(u))return 'g';if(/^(L|LT|LITRO)/.test(u))return 'l';if(/^ML/.test(u))return 'ml';if(/^(CX|CAIXA)/.test(u))return 'cx';if(/^(PCT|PT|PACOTE)/.test(u))return 'pct';if(/^(M|MT|METRO)$/.test(u))return 'm';return 'un'};
// Alguns fornecedores põem o lote no nome do item ("... LOTE L1917"): o lote sai do nome e vai para a entrada
function separaLote(n){const m=String(n||'').match(/\s*[-–]?\s*\bLOTE\b\s*:?\s*([A-Z0-9][\w\-\/.]*)/i);return m?{nome:(n.slice(0,m.index)+n.slice(m.index+m[0].length)).replace(/\s+/g,' ').trim(),lote:m[1]}:{nome:n,lote:''}}
function lerNFe(txt){
  const x=new DOMParser().parseFromString(txt,'application/xml');
  if(x.getElementsByTagName('parsererror').length)throw new Error('Arquivo XML inválido ou corrompido');
  const tag=(el,t)=>el?el.getElementsByTagName(t)[0]:null,g=(el,t)=>{const n=tag(el,t);return n?n.textContent.trim():''};
  const inf=x.getElementsByTagName('infNFe')[0];
  if(!inf)throw new Error('Este XML não é de uma NF-e (nota de produto). Notas de serviço (NFS-e) não dão entrada no estoque.');
  const ide=tag(inf,'ide'),emit=tag(inf,'emit'),en=tag(emit,'enderEmit'),tot=tag(inf,'ICMSTot');
  const itens=[...inf.getElementsByTagName('det')].map(d=>{const p=tag(d,'prod'),sl=separaLote(g(p,'xProd'));return {codigo:g(p,'cProd'),nome:sl.nome,loteNome:sl.lote,unidade:UNID_NFE(g(p,'uCom')),uCom:g(p,'uCom'),qtd:+g(p,'qCom')||0,custo:+g(p,'vUnCom')||0,total:+g(p,'vProd')||0,lote:g(tag(d,'rastro'),'nLote')}}).map(i=>({...i,lote:i.lote||i.loteNome})).filter(i=>i.qtd>0);
  if(!itens.length)throw new Error('A nota não tem itens com quantidade');
  const dups=[...inf.getElementsByTagName('dup')].map(d=>({n:g(d,'nDup'),venc:g(d,'dVenc'),valor:+g(d,'vDup')||0})).filter(d=>d.venc&&d.valor>0);
  const vProd=+g(tot,'vProd')||itens.reduce((s,i)=>s+i.total,0);
  return {chave:(inf.getAttribute('Id')||'').replace(/^NFe/,''),numero:g(ide,'nNF'),serie:g(ide,'serie'),emissao:(g(ide,'dhEmi')||g(ide,'dEmi')).slice(0,10),
    forn:{nome:g(emit,'xNome'),contato:g(emit,'xFant')||null,documento:fmtDoc(g(emit,'CNPJ')||g(emit,'CPF')),telefone:fmtFone(g(en,'fone'))||null,
      endereco:[[g(en,'xLgr'),g(en,'nro')].filter(Boolean).join(', '),g(en,'xBairro'),[g(en,'xMun'),g(en,'UF')].filter(Boolean).join('/'),g(en,'CEP')?'CEP '+g(en,'CEP'):''].filter(Boolean).join(' - ')||null},
    itens,dups,vProd,vFrete:+g(tot,'vFrete')||0,vDesc:+g(tot,'vDesc')||0,vNF:+g(tot,'vNF')||vProd};
}

function gravarNFe(form){const nf=S._nfe,f=Object.fromEntries(new FormData(form));busy($('#bnfe'),async()=>{
  const r=await checaNF({numero:nf.numero,chave:nf.chave,fornId:nf.fornId,fornNome:nf.forn.nome});r.a=nf.avisos||[];
  if(!dupBox(form,r))return;
  if(f.pg==='pago'&&!f.cta)return toast(MULTI()?'Escolha a conta usada no pagamento':'Caixa não encontrado. Atualize a página.',1);
  const eid=S.empresa.id,fat=f.ratear&&nf.vProd>0?nf.vNF/nf.vProd:1,obs=`NF-e ${nf.numero}${nf.serie?'/'+nf.serie:''} · chave ${nf.chave}`;
  let fid=nf.fornId;
  if(!fid)fid=(await q(sb.from('fornecedores').insert({...nf.forn,obs:'Cadastrado pela importação da NF-e '+nf.numero,empresa_id:eid}).select().single())).id;
  let novos=0;const vinc=vincLer(),criados={};
  for(const [ix,it] of nf.itens.entries()){
    const custo=Math.round(it.custo*fat*10000)/10000;let pid=f['m'+ix];
    const ck=normTxt(it.codigo||it.nome);
    if(pid==='__novo'&&criados[ck])pid=criados[ck]; // mesmo produto em 2 linhas da nota (lotes diferentes): cadastra uma vez só
    else if(pid==='__novo'){pid=(await q(sb.from('produtos').insert({codigo:it.codigo||null,nome:it.nome.slice(0,120),descricao:null,categoria:'Material',unidade:it.unidade,custo,preco:0,minimo:0,empresa_id:eid}).select().single())).id;criados[ck]=pid;novos++}
    else{const pr=P(pid);if(pr&&!pr.codigo&&it.codigo){try{await q(sb.from('produtos').update({codigo:it.codigo}).eq('id',pid))}catch(e){}}}
    vinc[vincChave(nf.forn.documento,it)]=pid;
    await rpc('registrar_entrada',{p_produto:pid,p_qtd:it.qtd,p_custo:custo,p_obs:obs+(it.lote?' · lote '+it.lote:''),p_fornecedor:fid,p_pagamento:'nenhum',p_conta:null,p_vencimento:null});
  }
  const desc=`NF-e ${nf.numero} — ${nf.forn.nome}`.slice(0,140),base={categoria:'Compra de mercadoria',fornecedor_id:fid,cliente_id:null,tipo:'pagar',empresa_id:eid};
  if(f.pg==='pago')await q(sb.from('lancamentos').insert({...base,descricao:desc,valor:nf.vNF,vencimento:today(),pago:true,data_pagamento:today(),conta_id:f.cta}));
  else if(f.pg==='prazo'){const ps=nf.dups.length?nf.dups.map((d,i)=>({...base,descricao:desc+` (parc. ${i+1}/${nf.dups.length})`,valor:d.valor,vencimento:d.venc})):[{...base,descricao:desc,valor:nf.vNF,vencimento:f.v||addDays(today(),30)}];
    await q(sb.from('lancamentos').insert(ps))}
  vincGravar(vinc);S._nfe=null;await recarregar();fechar();render();
  toast(`NF-e ${nf.numero} importada: ${nf.itens.length} item(ns)${novos?' · '+novos+' produto(s) novo(s)':''}`);
  if(novos)setTimeout(()=>toast('Defina o preço de venda dos produtos novos em Produtos, se for vendê-los'),3400);
})}

const PREC_PAD={aquisicao:0,impostos:6,cartao:3,comissao:0,despesas:15,margem:20,arred:'90'};

function arred(v,m){if(!isFinite(v))return v;if(m==='90'){let x=Math.floor(v)+0.9;if(x<v-1e-9)x+=1;return Math.round(x*100)/100}if(m==='50')return Math.ceil(v*2-1e-9)/2;if(m==='inteiro')return Math.ceil(v-1e-9);return Math.round(v*100)/100}
function precCalc(custo,cfg,margem){
  const cTot=custo*(1+(+cfg.aquisicao||0)/100);
  const var_=(+cfg.impostos||0)+(+cfg.cartao||0)+(+cfg.comissao||0)+(+cfg.despesas||0);
  const m=margem==null||margem===''?+cfg.margem||0:+margem;
  const soma=var_+m;if(soma>=100)return {erro:`Impostos + taxas + despesas + margem somam ${pct(soma)}. Precisa ficar abaixo de 100%.`};
  const bruto=cTot/(1-soma/100);const preco=arred(bruto,cfg.arred);
  return {cTot,var_,m,preco,markup:custo>0?preco/custo:0};
}
function precReal(preco,custo,cfg){
  if(!(preco>0))return null;const cTot=custo*(1+(+cfg.aquisicao||0)/100);
  const it=[['Custo da mercadoria',cTot,'#5b8cff'],['Impostos',preco*(+cfg.impostos||0)/100,'#ff8a5b'],['Taxa de cartão',preco*(+cfg.cartao||0)/100,'#ffb547'],['Comissão',preco*(+cfg.comissao||0)/100,'#c45bff'],['Despesas fixas',preco*(+cfg.despesas||0)/100,'#8d99bd']].filter(x=>x[1]>0.0049);
  const lucro=preco-it.reduce((s,x)=>s+x[1],0);
  return {itens:it,lucro,margem:lucro/preco*100};
}

  const nm=semAc(f.nome),doc=String(f.documento||'').replace(/\D/g,''),tels=String(f.telefone||'').split(/[\/;,]/).map(x=>x.replace(/\D/g,'').slice(-8)).filter(x=>x.length===8);
  const r=[];S[tab].forEach(y=>{if(y.id===id)return;
    const ydoc=String(y.documento||'').replace(/\D/g,''),ytel=String(y.telefone||'').split(/[\/;,]/).map(x=>x.replace(/\D/g,'').slice(-8));
    if(doc.length>=11&&ydoc===doc)r.push([y,'mesmo CPF/CNPJ']);
    else if(tels.some(t=>ytel.includes(t)))r.push([y,'mesmo telefone']);
    else if(nm.length>=4&&semAc(y.nome)===nm)r.push([y,'mesmo nome'])});
  return r}

async function caixaDia(tabs){
  const dia=S.caixaDia||(S.caixaDia=today());
  const ini=new Date(dia+'T00:00').toISOString(),fim=new Date(dia+'T23:59:59.999').toISOString();
  const [res,movs,vds]=await Promise.all([
    rpc('resumo_caixa',{p_empresa:S.empresa.id,p_dia:dia}),
    q(sb.from('lancamentos').select('*').eq('empresa_id',S.empresa.id).eq('pago',true).eq('data_pagamento',dia).order('criado_em')),
    q(sb.from('vendas').select('id,numero,total,pagamento,cancelada,data').eq('empresa_id',S.empresa.id).gte('data',ini).lte('data',fim))
  ]);
  const r=(res&&res[0])||{saldo_anterior:0,entradas:0,saidas:0};const ant=+r.saldo_anterior,ent=+r.entradas,sai=+r.saidas,fin=ant+ent-sai;
  const ms=movs.map(x=>({...x,valor:+x.valor}));S._lanc=ms;
  const pg={};vds.filter(v=>!v.cancelada).forEach(v=>pg[v.pagamento]=(pg[v.pagamento]||0)+(+v.total));
  S._fech={dia,ant,ent,sai,fin,pg,ms};

  return `<div class="row"><div><h1>Caixa</h1><p class="sub">Movimento diário: tudo que entrou e saiu do caixa no dia.</p></div><span class="sp"></span>
    <button class="btn" onclick="formLanc(null,{tipo:'pagar',pago:true,vencimento:S.caixaDia,categoria:'Outras despesas'})">− Saída / despesa</button><button class="btn p" onclick="formLanc(null,{tipo:'receber',pago:true,vencimento:S.caixaDia,categoria:'Outras receitas'})">+ Entrada</button></div>${tabs}
  <div class="card"><div class="row"><button class="btn sm" onclick="S.caixaDia=addDays(S.caixaDia,-1);render()">◀</button><input type="date" style="width:auto" value="${dia}" onchange="S.caixaDia=this.value||today();render()"><button class="btn sm" onclick="S.caixaDia=addDays(S.caixaDia,1);render()">▶</button>${hoje?'<span class="tag t-ok">Hoje</span>':`<button class="btn sm" onclick="S.caixaDia=today();render()">Hoje</button>`}<span class="sp"></span><button class="btn sm" onclick="copiarFechamento()">📋 Copiar fechamento</button><button class="btn sm" onclick="ajustarSaldoCaixa()">Saldo inicial</button></div></div>
  <div class="grid k4" style="margin-top:16px">
    <div class="card kpi"><div class="l">Saldo anterior</div><div class="v">${R(ant)}</div><div class="h">fim do dia anterior</div></div>
    <div class="card kpi"><div class="l">Entradas do dia</div><div class="v" style="color:var(--ok)">+ ${R(ent)}</div></div>
    <div class="card kpi"><div class="l">Saídas do dia</div><div class="v" style="color:var(--bad)">− ${R(sai)}</div></div>
    <div class="card kpi"><div class="l">Saldo final</div><div class="v" style="color:${fin<0?'var(--bad)':'var(--text)'}">${R(fin)}</div><div class="h">${hoje?'em caixa agora':'no fim do dia'}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Vendas do dia por forma de pagamento</h3><div class="row">${Object.entries(pg).map(([k,v])=>`<span class="tag ${k==='Fiado'?'t-warn':'t-blue'}" style="padding:8px 12px">${esc(k)}${k==='Fiado'?' (a receber)':''}: ${R(v)}</span>`).join('')||'<span style="color:var(--muted)">Nenhuma venda neste dia</span>'}</div></div>
  <div class="card tw" style="margin-top:16px"><h3>Movimentos</h3><table><tr><th>Hora</th><th>Descrição</th><th>Categoria</th><th class="num">Valor</th><th></th></tr>
  ${ms.map(x=>`<tr><td>${new Date(x.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td><b>${esc(x.descricao)}</b>${x.cliente_id&&nomeCli(x.cliente_id)?`<div style="color:var(--muted);font-size:12px">👤 ${esc(nomeCli(x.cliente_id))}</div>`:''}${x.fornecedor_id&&nomeForn(x.fornecedor_id)?`<div style="color:var(--muted);font-size:12px">🚚 ${esc(nomeForn(x.fornecedor_id))}</div>`:''}</td><td style="color:var(--muted)">${esc(x.categoria||'—')}</td><td class="num" style="color:${x.tipo==='receber'?'var(--ok)':'var(--bad)'}"><b>${x.tipo==='receber'?'+':'−'} ${R(x.valor)}</b></td>
  <td class="num">${x.venda_id?'<span class="tag t-blue">venda</span>':`<button class="btn sm" onclick="confirmar('Excluir este lançamento do caixa?',()=>delLanc('${x.id}'))">Excluir</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum movimento neste dia</td></tr>'}</table>
  <p style="color:var(--muted);font-size:12px;margin-top:10px">As vendas (exceto fiado) entram no caixa sozinhas. Fiado entra quando o cliente pagar (em A receber).</p></div>`;
}
function copiarFechamento(){
  const f=S._fech;if(!f)return;
  const said=f.ms.filter(x=>x.tipo==='pagar');
  const t=`*${S.empresa.nome}*\n*Fechamento de caixa — ${DD(f.dia)}*\n\nSaldo anterior: ${R(f.ant)}\nEntradas: + ${R(f.ent)}\nSaídas: − ${R(f.sai)}\n*Saldo final: ${R(f.fin)}*\n\n_Vendas por forma de pagamento:_\n${Object.entries(f.pg).map(([k,v])=>`• ${k}: ${R(v)}`).join('\n')||'• Nenhuma venda'}${said.length?`\n\n_Saídas:_\n${said.map(x=>`• ${x.descricao}: ${R(x.valor)}`).join('\n')}`:''}`;
  navigator.clipboard.writeText(t).then(()=>toast('Fechamento copiado! Cole no WhatsApp.'),()=>modal(`<h3>Fechamento</h3><textarea style="width:100%;min-height:260px;background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px">${esc(t)}</textarea><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn p" onclick="fechar()">Fechar</button></div>`));
}

    const d={descricao:f.descricao.trim(),valor:+f.valor,vencimento:f.vencimento,categoria:f.categoria,cliente_id:rec?(f.pessoa||null):null,fornecedor_id:rec?null:(f.pessoa||null)};
    const fm=e.target;
    if(!id&&f.pago){if(!f.conta_id)return toast(MULTI()?'Cadastre uma conta bancária primeiro':'Caixa não encontrado. Atualize a página.',1);Object.assign(d,{pago:true,data_pagamento:doCaixa?f.vencimento:today(),conta_id:f.conta_id})}
    busy($('#bl'),async()=>{if(!dupBox(fm,await checaLanc(d,t,id)))return;if(id)await q(sb.from('lancamentos').update(d).eq('id',id));else await q(sb.from('lancamentos').insert({...d,tipo:t,empresa_id:S.empresa.id}));await recarregar();fechar();toast('Lançamento salvo');render()});
  };
}
async function delLanc(id){try{await q(sb.from('lancamentos').delete().eq('id',id));await recarregar();toast('Lançamento excluído');render()}catch(e){erro(e)}}
function baixar(id){
  const x=S._lanc.find(y=>y.id===id),rec=x.tipo==='receber';
  if(!caixaId()&&!S.contas.length)return toast(MULTI()?'Cadastre uma conta bancária em Financeiro › Contas':'Caixa não encontrado. Atualize a página.',1);
  modal(`<h3>${rec?'Receber':'Pagar'}: ${R(x.valor)}</h3><p style="color:var(--muted);margin:4px 0 14px">${esc(x.descricao)}</p><form id="fb" class="f" style="grid-template-columns:1fr 1fr">
  ${MULTI()?`<div><label>${rec?'Entrou na conta':'Saiu da conta'}</label><select name="c">${optsList(S.contas,'')}</select></div>`:`<input type="hidden" name="c" value="${caixaId()}"><div style="align-self:end;color:var(--muted)">${rec?'Entra':'Sai'} do <b style="color:var(--text)">caixa</b> na data:</div>`}<div><label>Data</label><input name="d" type="date" value="${today()}" required></div>
  <div class="row" style="grid-column:span 2"><span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bb">✓ Confirmar</button></div></form>`);
  $('#fb').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));busy($('#bb'),async()=>{await q(sb.from('lancamentos').update({pago:true,data_pagamento:f.d,conta_id:f.c}).eq('id',id));await recarregar();fechar();toast(rec?'Recebimento registrado':'Pagamento registrado');render()})};
}
async function reabrir(id){try{await q(sb.from('lancamentos').update({pago:false,data_pagamento:null}).eq('id',id));await recarregar();toast('Lançamento reaberto');render()}catch(e){erro(e)}}

// ---- Equipe
VIEWS.equipe=async()=>{
  const ms=await q(sb.from('membros').select('*').eq('empresa_id',S.empresa.id));
  return `<h1>Equipe</h1><p class="sub">Dê acesso para funcionários. <b>Vendedor</b> só vende e consulta; <b>Dono</b> faz tudo. Marque quem <b>dá baixa no financeiro</b>; se ninguém estiver marcado, qualquer dono dá baixa.</p>
  <div class="card"><h3>Adicionar pessoa</h3><p style="color:var(--muted);margin-bottom:12px;font-size:13px">1) A pessoa abre o sistema e clica em <b>Criar conta</b> (sem cadastrar empresa). 2) Você digita o e-mail dela aqui.</p>
  <form class="f" onsubmit="event.preventDefault();addMembro(this)"><div class="c2"><label>E-mail</label><input name="email" type="email" required></div><div><label>Papel</label><select name="papel"><option value="vendedor">Vendedor</option><option value="dono">Dono</option></select></div><div style="align-self:end"><button class="btn p" style="width:100%">Adicionar</button></div></form></div>
  <div class="card tw" style="margin-top:16px"><table><tr><th>E-mail</th><th>Papel</th><th title="Quem pode dar e desfazer baixas no financeiro desta empresa">Dá baixa no financeiro</th><th title="Vê o financeiro, mas não cria, edita, exclui nem dá baixa">Financeiro só ver</th><th></th></tr>${ms.map(m=>`<tr><td>${esc(m.email)}${m.user_id===S.user.id?' <span class="tag t-blue">você</span>':''}</td><td>${m.papel==='dono'?'Dono':'Vendedor'}</td><td>${m.papel==='dono'?`<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" style="width:18px;height:18px" ${m.financeiro?'checked':''} onchange="defFin('${m.user_id}',this.checked)"> ${m.financeiro?'Sim':'—'}</label>`:'—'}</td><td>${m.papel==='dono'?`<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" style="width:18px;height:18px" ${m.fin_somente_ver?'checked':''} onchange="defFinVer('${m.user_id}',this.checked)"> ${m.fin_somente_ver?'👁️ Só ver':'—'}</label>`:'—'}</td><td class="num">${m.user_id!==S.user.id?`<button class="btn sm d" onclick="confirmar('Remover o acesso de ${esc(m.email)}?',()=>remMembro('${m.user_id}'))">Remover</button>`:''}</td></tr>`).join('')}</table></div>`;
};
const _finOrig=VIEWS.financeiro;
VIEWS.financeiro=async()=>{let h=await _finOrig();try{S._fv=await rpc('fin_somente_ver',{p_empresa:S.empresa.id})}catch(e){S._fv=false}
  if(S._fv){h=h.replace(/<button[^>]*onclick="(formLanc|formConta|baixar|reabrir|delLanc)\([^"]*"[^>]*>[\s\S]*?<\/button>/g,'');h='<div class="card" style="margin-bottom:12px;padding:10px 14px;font-size:13px;border-color:var(--warn)">👁️ Seu acesso ao financeiro é <b>somente para visualizar</b>.</div>'+h}
  return h};
async function defFin(uid,v){try{await rpc('definir_financeiro',{p_empresa:S.empresa.id,p_user:uid,p_valor:v});toast(v?'Pode dar baixa no financeiro':'Baixa removida');render()}catch(e){erro(e);render()}}
function addMembro(form){const f=Object.fromEntries(new FormData(form));busy(form.querySelector('button'),async()=>{await rpc('adicionar_membro',{p_empresa:S.empresa.id,p_email:f.email,p_papel:f.papel});toast('Acesso liberado para '+f.email);render()})}
async function remMembro(uid){try{await rpc('remover_membro',{p_empresa:S.empresa.id,p_user:uid});toast('Acesso removido');render()}catch(e){erro(e)}}

// ---- Minha conta
VIEWS.conta=()=>{
  const e=S.empresa;const st={teste:['Teste grátis','t-warn'],ativo:['Ativa','t-ok'],bloqueado:['Bloqueada','t-bad']}[e.status];
  return `<h1>Minha conta</h1><p class="sub">Dados da assinatura e do seu acesso.</p>
  <div class="grid k2"><div class="card"><h3>Assinatura</h3>
    <table><tr><td>Empresa</td><td class="num"><b>${esc(e.nome)}</b></td></tr><tr><td>Plano</td><td class="num">${esc(e.plano)}</td></tr><tr><td>Situação</td><td class="num"><span class="tag ${st[1]}">${st[0]}</span></td></tr><tr><td>Válida até</td><td class="num"><b>${DD(e.vencimento)}</b></td></tr></table>
    <h3 style="margin-top:18px">💠 ${e.status==='teste'?'Assinar':'Renovar'} com Pix</h3>${pixCard()}
    <a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:12px" href="${zap('Olá! Paguei o Pix do '+CONFIG.NOME_SISTEMA+' da empresa '+e.nome+'. Segue o comprovante:')}" target="_blank" rel="noopener">💬 Enviar comprovante pelo WhatsApp</a>
    <p style="color:var(--muted);font-size:12px;margin-top:8px;text-align:center">Suporte: +${esc(CONFIG.WHATSAPP_SUPORTE)}</p></div>
  <div class="card"><h3>Meu acesso</h3><p style="margin-bottom:14px">${esc(S.user.email)}<br><span style="color:var(--muted)">${S.papel==='dono'?'Dono':'Vendedor'}</span></p>
    <form class="f" style="grid-template-columns:1fr" onsubmit="event.preventDefault();trocarSenha(this)"><div><label>Nova senha</label><input name="s" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn">Trocar senha</button></form>
    <button class="btn d" style="width:100%;margin-top:12px" onclick="sair()">Sair do sistema</button></div></div>`;
};
function trocarSenha(form){busy(form.querySelector('button'),async()=>{const {error}=await sb.auth.updateUser({password:form.s.value});if(error)throw error;form.reset();toast('Senha alterada')})}

// ---- Admin (você)
VIEWS.admin=async()=>{
  const l=await rpc('admin_listar');S._adm=l;
  const ativos=l.filter(e=>e.status==='ativo'&&e.vencimento>=today()).length,testes=l.filter(e=>e.status==='teste'&&e.vencimento>=today()).length,venc=l.filter(e=>e.vencimento<today()||e.status==='bloqueado').length;
  let av=[];try{av=await rpc('admin_avisos')}catch(e){}S._av=av;S.avisosN=av.length;
  const avH=av.length?`<div class="card" style="border:2px solid var(--warn);margin-bottom:16px"><h3>🔔 Avisos de pagamento (${av.length})</h3>
   ${av.map(a=>`<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)"><div style="flex:1;min-width:220px"><b>${esc(a.nomes||'')}</b><br><span class="tag ${a.tipo==='anual'?'t-blue':'t-ok'}">${a.tipo==='anual'?'🗓️ Anual → +1 ano':'📅 Mensal → +30 dias'}</span> ${a.valor!=null?'<b>'+R(a.valor)+'</b>':''}<div style="color:var(--muted);font-size:12px;margin-top:4px">${esc(a.email||'')} · ${new Date(a.criado_em).toLocaleString('pt-BR')}${a.obs?' · '+esc(a.obs):''}</div></div>
   <div class="row" style="gap:8px"><button class="btn sm ok" onclick="resolverAviso('${a.id}',true)">✅ Confirmar</button><button class="btn sm d" onclick="resolverAviso('${a.id}',false)">Recusar</button></div></div>`).join('')}
   <p style="color:var(--muted);font-size:12px;margin-top:8px">Confira se o Pix caiu na sua conta antes de confirmar. Ao confirmar, o sistema renova sozinho (+30 dias ou +1 ano) todas as empresas do aviso.</p></div>`:'';
  return avH+`<h1>Admin — seus clientes</h1><p class="sub">Libere, renove ou bloqueie cada empresa. Recebeu o Pix? Clique em <b>💰 Pago (+1 ano)</b> — todas as empresas do mesmo dono são renovadas juntas.</p>
  <div class="grid k4"><div class="card kpi"><div class="l">Clientes ativos</div><div class="v" style="color:var(--ok)">${ativos}</div></div><div class="card kpi"><div class="l">Em teste</div><div class="v" style="color:var(--warn)">${testes}</div></div><div class="card kpi"><div class="l">Vencidos/bloqueados</div><div class="v" style="color:var(--bad)">${venc}</div></div><div class="card kpi"><div class="l">Total</div><div class="v">${l.length}</div></div></div>
  <div class="card tw" style="margin-top:16px"><table><tr><th>Empresa</th><th>Dono</th><th>Plano</th><th>Situação</th><th>Vence</th><th class="num">Vendas 30d</th><th></th></tr>
  ${l.map(e=>{const venceu=e.vencimento<today();const st=e.status==='bloqueado'?['Bloqueado','t-bad']:venceu?['Vencido','t-bad']:e.status==='teste'?['Teste','t-warn']:['Ativo','t-ok'];return `<tr><td><b>${esc(e.nome)}</b><div style="color:var(--muted);font-size:12px">${esc(e.whatsapp||'')} · ${e.usuarios} usuário(s) · ${e.produtos} produtos</div></td><td>${esc(e.dono_email||'—')}</td><td>${esc(e.plano)}</td><td><span class="tag ${st[1]}">${st[0]}</span></td><td>${DD(e.vencimento)}</td><td class="num">${e.vendas_30d}</td><td class="num" style="white-space:nowrap"><button class="btn sm ok" onclick="pagoAno('${e.id}')">💰 Pago (+1 ano)</button> <button class="btn sm p" onclick="renovar('${e.id}')">+30 dias</button> <button class="btn sm" onclick="editEmp('${e.id}')">Editar</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nenhum cliente ainda</td></tr>'}</table></div>`;
};
const admUpd=async(e,ch)=>{const n={status:ch.status??e.status,vencimento:ch.vencimento??e.vencimento,plano:ch.plano??e.plano};await rpc('admin_atualizar',{p_empresa:e.id,p_status:n.status,p_vencimento:n.vencimento,p_plano:n.plano});
  (S.empresas||[]).forEach(x=>{if(x.id===e.id)Object.assign(x,n)});if(S.empresa&&S.empresa.id===e.id)Object.assign(S.empresa,n);};
async function renovar(id){const e=S._adm.find(x=>x.id===id);const base=e.vencimento>=today()?e.vencimento:today();try{await admUpd(e,{status:'ativo',vencimento:addDays(base,30)});toast(e.nome+' renovado até '+DD(addDays(base,30)));render()}catch(er){erro(er)}}
async function resolverAviso(id,ok){const a=(S._av||[]).find(x=>x.id===id);if(!ok&&!confirm('Recusar este aviso? A assinatura não será renovada.'))return;
  try{await rpc('admin_resolver_aviso',{p_id:id,p_ok:ok});toast(ok?(a.nomes+' renovada(s) '+(a.tipo==='anual'?'por 1 ano':'por 30 dias')+' ✅'):'Aviso recusado');
    if(ok&&a){const mem=await q(sb.from('membros').select('papel,empresa_id,empresas(*)').eq('user_id',S.user.id));S.empresas=mem.filter(m=>m.empresas).map(m=>({...m.empresas,papel:m.papel})).sort((x,y)=>x.nome.localeCompare(y.nome));const cur=S.empresas.find(x=>S.empresa&&x.id===S.empresa.id);if(cur)Object.assign(S.empresa,cur)}
    render()}catch(e){erro(e)}}
const addAno=iso=>{const d=new Date(iso+'T12:00');d.setFullYear(d.getFullYear()+1);return d.toISOString().slice(0,10)};
function pagoAno(id){const e=S._adm.find(x=>x.id===id);const base=x=>(x.status==='ativo'&&x.vencimento>=today())?x.vencimento:today();
  modal(`<h3>💰 Pagamento recebido</h3><p class="sub" style="margin:4px 0 12px">Marque as empresas que esse pagamento cobre. Elas ficam <b>Ativas por 1 ano</b>.</p>
  <form id="fpa">${S._adm.map(x=>`<label style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer"><input type="checkbox" name="e" value="${x.id}" ${(x.id===e.id||(e.dono_email&&x.dono_email===e.dono_email))?'checked':''}><span style="flex:1"><b>${esc(x.nome)}</b><br><small style="color:var(--muted)">Hoje: ${esc(x.status)} até ${DD(x.vencimento)} → nova validade <b>${DD(addAno(base(x)))}</b></small></span></label>`).join('')}
  <div class="row"><span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bpa">Confirmar pagamento</button></div></form>`);
  $('#fpa').onsubmit=ev=>{ev.preventDefault();const ids=[...ev.target.querySelectorAll('input[name=e]:checked')].map(i=>i.value);if(!ids.length)return toast('Marque ao menos uma empresa');
    busy($('#bpa'),async()=>{for(const i of ids){const x=S._adm.find(y=>y.id===i);await admUpd(x,{status:'ativo',vencimento:addAno(base(x))})}fechar();toast(ids.length+' empresa(s) renovada(s) por 1 ano ✅');render()})}}
function editEmp(id){const e=S._adm.find(x=>x.id===id);modal(`<h3>${esc(e.nome)}</h3><form id="fem" class="f" style="grid-template-columns:1fr 1fr">
  <div><label>Situação</label><select name="status">${['teste','ativo','bloqueado'].map(s=>`<option ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></div>
  <div><label>Plano</label><select name="plano">${['basico','profissional','personalizado'].map(s=>`<option ${s===e.plano?'selected':''}>${s}</option>`).join('')}</select></div>
  <div style="grid-column:span 2"><label>Válido até</label><input name="vencimento" type="date" value="${e.vencimento}" required></div>
  <div class="row" style="grid-column:span 2"><span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bem">Salvar</button></div></form>`);
  $('#fem').onsubmit=ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));busy($('#bem'),async()=>{await admUpd(e,f);fechar();toast('Cliente atualizado');render()})}}

// ============ INÍCIO ============
if(sb){sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>{modal(`<h3>Criar nova senha</h3><form class="f" style="grid-template-columns:1fr;margin-top:10px" onsubmit="event.preventDefault();busy(this.querySelector('button'),async()=>{const {error}=await sb.auth.updateUser({password:this.s.value});if(error)throw error;fechar();toast('Senha alterada!');carregarSessao()})"><div><label>Nova senha</label><input name="s" type="password" minlength="6" required></div><button class="btn p">Salvar nova senha</button></form>`)},300)}})}
carregarSessao().then(()=>{if(VEIO_DE_CONVITE&&S.user)setTimeout(criarSenhaConvite,400)}).catch(erro);
function criarSenhaConvite(){
  modal(`<h3>👋 Bem-vindo(a)!</h3><p style="color:var(--muted);margin:8px 0 14px">Crie a sua senha para entrar no sistema das próximas vezes com o e-mail <b style="color:var(--text)">${esc(S.user.email)}</b>.</p>
  <form id="fcs" class="f" style="grid-template-columns:1fr"><div><label>Nova senha (mínimo 6 caracteres)</label><input name="s" type="password" minlength="6" required autocomplete="new-password"></div>
  <div><label>Repita a senha</label><input name="s2" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn p" id="bcs">Salvar minha senha</button></form>`);
  $('#fcs').onsubmit=e=>{e.preventDefault();if(e.target.s.value!==e.target.s2.value)return toast('As senhas não são iguais',1);busy($('#bcs'),async()=>{const {error}=await sb.auth.updateUser({password:e.target.s.value});if(error)throw error;fechar();toast('Senha criada! Use seu e-mail e essa senha para entrar.')})};
}
