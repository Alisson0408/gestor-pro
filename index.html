VIEWS.clientes=()=>viewCad('clientes');
VIEWS.fornecedores=()=>viewCad('fornecedores');
function formCad(tab,id,rapido){
  const c=CAD[tab],x=id?S[tab].find(y=>y.id===id):{};
  modal(`<h3>${id?'Editar':'Novo'} ${c.um}</h3><form id="fc" class="f" style="grid-template-columns:1fr 1fr">${c.campos.map(([k,l,w])=>`<div ${w?'style="grid-column:span 2"':''}><label>${l}</label><input name="${k}" value="${esc(x[k]||'')}" ${k==='nome'?'required':''} ${k==='email'?'type="email"':''}></div>`).join('')}
  <div class="row" style="grid-column:span 2">${id?`<button type="button" class="btn d" onclick="fechar();confirmar('Excluir este ${c.um}? O histórico é mantido.',()=>delCad('${tab}','${id}'))">Excluir</button>`:''}<span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bc">Salvar</button></div></form>`);
  $('#fc').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));Object.keys(f).forEach(k=>f[k]=f[k].trim()||null);
    busy($('#bc'),async()=>{
      let nid=id;
      if(id)await q(sb.from(tab).update(f).eq('id',id));
      else nid=(await q(sb.from(tab).insert({...f,empresa_id:S.empresa.id}).select().single())).id;
      await recarregar();fechar();toast(c.um[0].toUpperCase()+c.um.slice(1)+' salvo');
      if(rapido&&S.view==='pdv'){S.pdvF.cli=nid;render()}
      else if(rapido&&S.view==='entrada'){const sel=document.querySelector('#fe select[name=f]');if(sel){sel.innerHTML=optsList(S.fornecedores,nid,'— sem fornecedor —')}}
      else render();
    });
  };
}
async function delCad(tab,id){try{await q(sb.from(tab).update({ativo:false}).eq('id',id));await recarregar();toast('Excluído');render()}catch(e){erro(e)}}
async function histCli(id){
  try{
    const vs=(await q(sb.from('vendas').select('*,venda_itens(*)').eq('cliente_id',id).order('data',{ascending:false}).limit(100))).map(normVenda);
    const at=vs.filter(v=>!v.cancelada);const ab=S.abertos.filter(a=>a.cliente_id===id);
    modal(`<h3>👤 ${esc(nomeCli(id))}</h3><div class="row" style="margin:6px 0 14px"><span class="tag t-blue" style="padding:7px 11px">${at.length} compra(s)</span><span class="tag t-ok" style="padding:7px 11px">Total ${R(at.reduce((s,v)=>s+v.total,0))}</span>${dono()&&ab.length?`<span class="tag t-warn" style="padding:7px 11px">Fiado em aberto ${R(ab.reduce((s,a)=>s+a.valor,0))}</span>`:''}</div>
    <div class="tw"><table><tr><th>#</th><th>Data</th><th>Pagamento</th><th class="num">Total</th></tr>${vs.map(v=>`<tr style="${v.cancelada?'opacity:.5':''}"><td>${v.numero}</td><td>${D(v.data)}</td><td>${esc(v.pagamento)}</td><td class="num">${R(v.total)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhuma compra ainda</td></tr>'}</table></div>
    <div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn p" onclick="fechar()">Fechar</button></div>`);
  }catch(e){erro(e)}
}

// ---- Financeiro
VIEWS.financeiro=async()=>{
  if(!MULTI()&&S.finTab==='contas')S.finTab='caixa';if(MULTI()&&S.finTab==='caixa')S.finTab='contas';
  const t=S.finTab;
  const tabs=`<div class="tabs" style="max-width:520px">${[MULTI()?['contas','🏦 Contas bancárias']:['caixa','💵 Caixa do dia'],['receber','⬇️ A receber'],['pagar','⬆️ A pagar']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="S.finTab='${k}';render()">${l}</button>`).join('')}</div>`;
  if(t==='caixa')return await caixaDia(tabs);
  if(t==='contas'){
    const tot=S.contas.reduce((s,c)=>s+((S.saldos[c.id]||{}).saldo??c.saldo_inicial),0);
    return `<div class="row"><div><h1>Financeiro</h1><p class="sub">Saldos dos bancos, contas a pagar e a receber.</p></div><span class="sp"></span><button class="btn p" onclick="formConta()">+ Nova conta bancária</button></div>${tabs}
    <div class="card kpi" style="margin-bottom:16px"><div class="l">Saldo total (todas as contas)</div><div class="v" style="color:${tot<0?'var(--bad)':'var(--text)'}">${R(tot)}</div></div>
    <div class="contas">${S.contas.map(c=>{const s=S.saldos[c.id]||{saldo:c.saldo_inicial,ent:0,sai:0};return `<div class="card cb ${c.banco==='Banco do Brasil'?'bb':''}"><div class="bk">${esc(c.banco||'Banco')}</div><div style="font-weight:700;margin-top:2px">${esc(c.nome)}</div>${c.agencia||c.conta?`<div style="color:var(--muted);font-size:12px">Ag ${esc(c.agencia||'—')} · CC ${esc(c.conta||'—')}</div>`:''}
      <div class="sd" style="color:${s.saldo<0?'var(--bad)':'var(--text)'}">${R(s.saldo)}</div><div style="font-size:12px;color:var(--muted)">Mês: <span style="color:var(--ok)">+${R(s.ent)}</span> · <span style="color:var(--bad)">−${R(s.sai)}</span></div>
      <div class="row" style="margin-top:12px"><button class="btn sm" onclick="extrato('${c.id}')">Extrato</button><button class="btn sm" onclick="formConta('${c.id}')">Editar</button></div></div>`}).join('')||'<div class="card empty" style="grid-column:1/-1">Nenhuma conta ainda. Cadastre o Banco do Brasil, a Caixa, o caixa físico da loja…</div>'}</div>`;
  }
  let qq=sb.from('lancamentos').select('*').eq('empresa_id',S.empresa.id).eq('tipo',t);
  const F=S.finFiltro;
  if(F==='abertos')qq=qq.eq('pago',false);else if(F==='vencidos')qq=qq.eq('pago',false).lt('vencimento',today());else if(F==='pagos')qq=qq.eq('pago',true);
  const l=(await q(qq.order(F==='pagos'?'data_pagamento':'vencimento',{ascending:F!=='pagos'}).limit(300))).map(x=>({...x,valor:+x.valor}));
  S._lanc=l;const rec=t==='receber';
  return `<div class="row"><div><h1>${MULTI()?'Financeiro':'Caixa'}</h1><p class="sub">${rec?'O que seus clientes devem e o que já entrou.':'Contas, boletos e fornecedores a pagar.'}</p></div><span class="sp"></span><button class="btn p" onclick="formLanc()">+ Nova conta a ${t}</button></div>${tabs}
  <div class="card"><div class="row"><select style="width:auto" onchange="S.finFiltro=this.value;render()">${[['abertos','Em aberto'],['vencidos','Vencidos'],['pagos',rec?'Recebidos':'Pagos'],['todos','Todos']].map(([k,n])=>`<option value="${k}" ${F===k?'selected':''}>${n}</option>`).join('')}</select><span class="sp"></span><b>Total: ${R(l.reduce((s,x)=>s+x.valor,0))}</b></div></div>
  <div class="card tw" style="margin-top:16px"><table><tr><th>Vencimento</th><th>Descrição</th><th>${rec?'Cliente':'Fornecedor'}</th><th>Conta</th><th class="num">Valor</th><th>Situação</th><th></th></tr>
  ${l.map(x=>{const venc=!x.pago&&x.vencimento<today();const st=x.pago?[rec?'Recebido':'Pago','t-ok']:venc?['Vencido','t-bad']:x.vencimento===today()?['Vence hoje','t-warn']:['Em aberto','t-blue'];
    return `<tr><td>${DD(x.vencimento)}</td><td><b>${esc(x.descricao)}</b>${x.categoria?`<div style="color:var(--muted);font-size:12px">${esc(x.categoria)}</div>`:''}</td><td>${esc((rec?nomeCli(x.cliente_id):nomeForn(x.fornecedor_id))||'—')}</td><td>${esc(nomeConta(x.conta_id)||'—')}${x.pago&&x.data_pagamento?`<div style="color:var(--muted);font-size:12px">em ${DD(x.data_pagamento)}</div>`:''}</td><td class="num"><b>${R(x.valor)}</b></td><td><span class="tag ${st[1]}">${st[0]}</span></td>
    <td class="num" style="white-space:nowrap">${x.pago?`<button class="btn sm" onclick="reabrir('${x.id}')">Desfazer</button>`:`<button class="btn sm p" onclick="baixar('${x.id}')">${rec?'Receber':'Pagar'}</button>`} ${x.venda_id?'':`<button class="btn sm" onclick="formLanc('${x.id}')">Editar</button>`}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nada por aqui</td></tr>'}</table></div>`;
};
async function caixaDia(tabs){
  const dia=S.caixaDia||(S.caixaDia=today());
  const ini=new Date(dia+'T00:00').toISOString(),fim=new Date(dia+'T23:59:59.999').toISOString();
  const [res,movs,vds]=await Promise.all([
    rpc('resumo_caixa',{p_empresa:S.empresa.id,p_dia:dia}),
    q(sb.from('lancamentos').select('*').eq('empresa_id',S.empresa.id).eq('pago',true).eq('data_pagamento',dia).order('criado_em')),
    q(sb.from('vendas').select('id,numero,total,pagamento,cancelada,data').eq('empresa_id',S.empresa.id).gte('data',ini).lte('data',fim))
  ]);
  const r=(res&&res[0])||{saldo_anterior:0,entradas:0,saidas:0};const ant=+r.saldo_anterior,ent=+r.entradas,sai=+r.saidas,fin=ant+ent-sai;
  const ms=movs.map(x=>({...x,valor:+x.valor}));S._lanc=ms;
  const pg={};vds.filter(v=>!v.cancelada).forEach(v=>pg[v.pagamento]=(pg[v.pagamento]||0)+(+v.total));
  S._fech={dia,ant,ent,sai,fin,pg,ms};
  const hoje=dia===today();
  return `<div class="row"><div><h1>Caixa</h1><p class="sub">Movimento diário: tudo que entrou e saiu do caixa no dia.</p></div><span class="sp"></span>
    <button class="btn" onclick="formLanc(null,{tipo:'pagar',pago:true,vencimento:S.caixaDia,categoria:'Outras despesas'})">− Saída / despesa</button><button class="btn p" onclick="formLanc(null,{tipo:'receber',pago:true,vencimento:S.caixaDia,categoria:'Outras receitas'})">+ Entrada</button></div>${tabs}
  <div class="card"><div class="row"><button class="btn sm" onclick="S.caixaDia=addDays(S.caixaDia,-1);render()">◀</button><input type="date" style="width:auto" value="${dia}" onchange="S.caixaDia=this.value||today();render()"><button class="btn sm" onclick="S.caixaDia=addDays(S.caixaDia,1);render()">▶</button>${hoje?'<span class="tag t-ok">Hoje</span>':`<button class="btn sm" onclick="S.caixaDia=today();render()">Hoje</button>`}<span class="sp"></span><button class="btn sm" onclick="copiarFechamento()">📋 Copiar fechamento</button><button class="btn sm" onclick="ajustarSaldoCaixa()">Saldo inicial</button></div></div>
  <div class="grid k4" style="margin-top:16px">
    <div class="card kpi"><div class="l">Saldo anterior</div><div class="v">${R(ant)}</div><div class="h">fim do dia anterior</div></div>
    <div class="card kpi"><div class="l">Entradas do dia</div><div class="v" style="color:var(--ok)">+ ${R(ent)}</div></div>
    <div class="card kpi"><div class="l">Saídas do dia</div><div class="v" style="color:var(--bad)">− ${R(sai)}</div></div>
    <div class="card kpi"><div class="l">Saldo final</div><div class="v" style="color:${fin<0?'var(--bad)':'var(--text)'}">${R(fin)}</div><div class="h">${hoje?'em caixa agora':'no fim do dia'}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Vendas do dia por forma de pagamento</h3><div class="row">${Object.entries(pg).map(([k,v])=>`<span class="tag ${k==='Fiado'?'t-warn':'t-blue'}" style="padding:8px 12px">${esc(k)}${k==='Fiado'?' (a receber)':''}: ${R(v)}</span>`).join('')||'<span style="color:var(--muted)">Nenhuma venda neste dia</span>'}</div></div>
  <div class="card tw" style="margin-top:16px"><h3>Movimentos</h3><table><tr><th>Hora</th><th>Descrição</th><th>Categoria</th><th class="num">Valor</th><th></th></tr>
  ${ms.map(x=>`<tr><td>${new Date(x.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td><td><b>${esc(x.descricao)}</b>${x.cliente_id&&nomeCli(x.cliente_id)?`<div style="color:var(--muted);font-size:12px">👤 ${esc(nomeCli(x.cliente_id))}</div>`:''}${x.fornecedor_id&&nomeForn(x.fornecedor_id)?`<div style="color:var(--muted);font-size:12px">🚚 ${esc(nomeForn(x.fornecedor_id))}</div>`:''}</td><td style="color:var(--muted)">${esc(x.categoria||'—')}</td><td class="num" style="color:${x.tipo==='receber'?'var(--ok)':'var(--bad)'}"><b>${x.tipo==='receber'?'+':'−'} ${R(x.valor)}</b></td>
  <td class="num">${x.venda_id?'<span class="tag t-blue">venda</span>':`<button class="btn sm" onclick="confirmar('Excluir este lançamento do caixa?',()=>delLanc('${x.id}'))">Excluir</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhum movimento neste dia</td></tr>'}</table>
  <p style="color:var(--muted);font-size:12px;margin-top:10px">As vendas (exceto fiado) entram no caixa sozinhas. Fiado entra quando o cliente pagar (em A receber).</p></div>`;
}
function copiarFechamento(){
  const f=S._fech;if(!f)return;
  const said=f.ms.filter(x=>x.tipo==='pagar');
  const t=`*${S.empresa.nome}*\n*Fechamento de caixa — ${DD(f.dia)}*\n\nSaldo anterior: ${R(f.ant)}\nEntradas: + ${R(f.ent)}\nSaídas: − ${R(f.sai)}\n*Saldo final: ${R(f.fin)}*\n\n_Vendas por forma de pagamento:_\n${Object.entries(f.pg).map(([k,v])=>`• ${k}: ${R(v)}`).join('\n')||'• Nenhuma venda'}${said.length?`\n\n_Saídas:_\n${said.map(x=>`• ${x.descricao}: ${R(x.valor)}`).join('\n')}`:''}`;
  navigator.clipboard.writeText(t).then(()=>toast('Fechamento copiado! Cole no WhatsApp.'),()=>modal(`<h3>Fechamento</h3><textarea style="width:100%;min-height:260px;background:#0c1328;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px">${esc(t)}</textarea><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn p" onclick="fechar()">Fechar</button></div>`));
}
function ajustarSaldoCaixa(){
  const c=S.contas.find(x=>x.id===caixaId());if(!c)return toast('Caixa não encontrado',1);
  modal(`<h3>Saldo inicial do caixa</h3><p style="color:var(--muted);margin:6px 0 14px">Quanto havia em caixa quando vocês começaram a usar o sistema. Use só na implantação ou para corrigir.</p><form id="fsc" class="f" style="grid-template-columns:1fr"><div><label>Saldo inicial (R$)</label><input name="v" type="number" step="0.01" value="${c.saldo_inicial}"></div><div class="row"><span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bsc">Salvar</button></div></form>`);
  $('#fsc').onsubmit=e=>{e.preventDefault();busy($('#bsc'),async()=>{await q(sb.from('contas_bancarias').update({saldo_inicial:+e.target.v.value||0}).eq('id',c.id));await recarregar();fechar();toast('Saldo inicial atualizado');render()})};
}
function formConta(id){
  const c=id?S.contas.find(x=>x.id===id):{banco:'Banco do Brasil',tipo:'corrente',saldo_inicial:0};
  modal(`<h3>${id?'Editar':'Nova'} conta bancária</h3><form id="fcb" class="f" style="grid-template-columns:1fr 1fr">
  <div><label>Banco</label><select name="banco">${BANCOS.map(b=>`<option ${b===c.banco?'selected':''}>${b}</option>`).join('')}</select></div>
  <div><label>Tipo</label><select name="tipo">${[['corrente','Conta corrente'],['poupanca','Poupança'],['caixa','Caixa (dinheiro)']].map(([k,n])=>`<option value="${k}" ${k===c.tipo?'selected':''}>${n}</option>`).join('')}</select></div>
  <div style="grid-column:span 2"><label>Apelido da conta *</label><input name="nome" required placeholder="Ex.: BB Empresa, Caixa da loja" value="${esc(c.nome||'')}"></div>
  <div><label>Agência</label><input name="agencia" value="${esc(c.agencia||'')}"></div><div><label>Conta</label><input name="conta" value="${esc(c.conta||'')}"></div>
  <div style="grid-column:span 2"><label>Saldo inicial (o que tem hoje na conta)</label><input name="saldo_inicial" type="number" step="0.01" value="${c.saldo_inicial}"></div>
  <div class="row" style="grid-column:span 2">${id?`<button type="button" class="btn d" onclick="fechar();confirmar('Desativar esta conta? Os lançamentos são mantidos.',()=>delConta('${id}'))">Desativar</button>`:''}<span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bcb">Salvar</button></div></form>`);
  $('#fcb').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.saldo_inicial=+f.saldo_inicial||0;['agencia','conta'].forEach(k=>f[k]=f[k].trim()||null);
    busy($('#bcb'),async()=>{if(id)await q(sb.from('contas_bancarias').update(f).eq('id',id));else await q(sb.from('contas_bancarias').insert({...f,empresa_id:S.empresa.id}));await recarregar();fechar();toast('Conta salva');render()})};
}
async function delConta(id){try{await q(sb.from('contas_bancarias').update({ativo:false}).eq('id',id));await recarregar();toast('Conta desativada');render()}catch(e){erro(e)}}
async function extrato(id){
  try{
    const c=S.contas.find(x=>x.id===id);
    const l=await q(sb.from('lancamentos').select('*').eq('conta_id',id).eq('pago',true).order('data_pagamento',{ascending:false}).limit(200));
    modal(`<h3>Extrato — ${esc(c.nome)}</h3><p style="color:var(--muted);margin-bottom:10px">${esc(c.banco||'')} · Saldo atual <b style="color:var(--text)">${R((S.saldos[id]||{}).saldo??c.saldo_inicial)}</b></p>
    <div class="tw"><table><tr><th>Data</th><th>Descrição</th><th class="num">Valor</th></tr>${l.map(x=>`<tr><td>${DD(x.data_pagamento)}</td><td>${esc(x.descricao)}</td><td class="num" style="color:${x.tipo==='receber'?'var(--ok)':'var(--bad)'}"><b>${x.tipo==='receber'?'+':'−'}${R(x.valor)}</b></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sem movimentação ainda</td></tr>'}
    <tr><td>—</td><td style="color:var(--muted)">Saldo inicial</td><td class="num">${R(c.saldo_inicial)}</td></tr></table></div>
    <div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn p" onclick="fechar()">Fechar</button></div>`);
  }catch(e){erro(e)}
}
const CATS={receber:['Venda','Serviço','Outras receitas'],pagar:['Compra de mercadoria','Fornecedores','Aluguel','Energia','Água','Internet / telefone','Salários','Impostos','Manutenção','Outras despesas']};
function formLanc(id,pre){
  const x=id?S._lanc.find(y=>y.id===id):{tipo:['receber','pagar'].includes(S.finTab)?S.finTab:'pagar',vencimento:today(),pago:false,...(pre||{})};
  const doCaixa=!id&&pre&&pre.pago;
  const t=x.tipo,rec=t==='receber';
  modal(`<h3>${doCaixa?(rec?'💵 Entrada no caixa':'💸 Saída do caixa'):(id?'Editar':'Nova')+' conta a '+t}</h3><form id="fl" class="f" style="grid-template-columns:1fr 1fr">
  <div style="grid-column:span 2"><label>Descrição *</label><input name="descricao" required value="${esc(x.descricao||'')}" placeholder="${rec?'Ex.: Serviço prestado ao Dr. Carlos':'Ex.: Conta de luz de novembro'}"></div>
  <div><label>Valor (R$) *</label><input name="valor" type="number" min="0.01" step="0.01" required value="${x.valor||''}"></div>
  <div><label>${doCaixa?'Data':'Vencimento'}</label><input name="vencimento" type="date" required value="${x.vencimento}"></div>
  <div><label>Categoria</label><select name="categoria">${CATS[t].map(c=>`<option ${c===x.categoria?'selected':''}>${c}</option>`).join('')}</select></div>
  <div><label>${rec?'Cliente':'Fornecedor'}</label><select name="pessoa">${optsList(rec?S.clientes:S.fornecedores,rec?x.cliente_id:x.fornecedor_id,'—')}</select></div>
  ${id?'':doCaixa?'<input type="hidden" name="pago" value="1">':`<div style="grid-column:span 2"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" name="pago" style="width:auto" onchange="$('#flc').classList.toggle('hide',!this.checked)"> Já foi ${rec?'recebido':'pago'}${MULTI()?'':' (lança no caixa)'}</label></div>`}
  ${id?'':MULTI()?`<div id="flc" class="${doCaixa?'':'hide'}" style="grid-column:span 2"><label>Conta</label><select name="conta_id">${optsList(S.contas,'')}</select></div>`:`<input type="hidden" name="conta_id" value="${caixaId()||''}">`}
  <div class="row" style="grid-column:span 2">${id?`<button type="button" class="btn d" onclick="fechar();confirmar('Excluir este lançamento?',()=>delLanc('${id}'))">Excluir</button>`:''}<span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bl">Salvar</button></div></form>`);
  $('#fl').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    const d={descricao:f.descricao.trim(),valor:+f.valor,vencimento:f.vencimento,categoria:f.categoria,cliente_id:rec?(f.pessoa||null):null,fornecedor_id:rec?null:(f.pessoa||null)};
    if(!id&&f.pago){if(!f.conta_id)return toast(MULTI()?'Cadastre uma conta bancária primeiro':'Caixa não encontrado. Atualize a página.',1);Object.assign(d,{pago:true,data_pagamento:doCaixa?f.vencimento:today(),conta_id:f.conta_id})}
    busy($('#bl'),async()=>{if(id)await q(sb.from('lancamentos').update(d).eq('id',id));else await q(sb.from('lancamentos').insert({...d,tipo:t,empresa_id:S.empresa.id}));await recarregar();fechar();toast('Lançamento salvo');render()});
  };
}
async function delLanc(id){try{await q(sb.from('lancamentos').delete().eq('id',id));await recarregar();toast('Lançamento excluído');render()}catch(e){erro(e)}}
function baixar(id){
  const x=S._lanc.find(y=>y.id===id),rec=x.tipo==='receber';
  if(!caixaId()&&!S.contas.length)return toast(MULTI()?'Cadastre uma conta bancária em Financeiro › Contas':'Caixa não encontrado. Atualize a página.',1);
  modal(`<h3>${rec?'Receber':'Pagar'}: ${R(x.valor)}</h3><p style="color:var(--muted);margin:4px 0 14px">${esc(x.descricao)}</p><form id="fb" class="f" style="grid-template-columns:1fr 1fr">
  ${MULTI()?`<div><label>${rec?'Entrou na conta':'Saiu da conta'}</label><select name="c">${optsList(S.contas,'')}</select></div>`:`<input type="hidden" name="c" value="${caixaId()}"><div style="align-self:end;color:var(--muted)">${rec?'Entra':'Sai'} do <b style="color:var(--text)">caixa</b> na data:</div>`}<div><label>Data</label><input name="d" type="date" value="${today()}" required></div>
  <div class="row" style="grid-column:span 2"><span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bb">✓ Confirmar</button></div></form>`);
  $('#fb').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));busy($('#bb'),async()=>{await q(sb.from('lancamentos').update({pago:true,data_pagamento:f.d,conta_id:f.c}).eq('id',id));await recarregar();fechar();toast(rec?'Recebimento registrado':'Pagamento registrado');render()})};
}
async function reabrir(id){try{await q(sb.from('lancamentos').update({pago:false,data_pagamento:null}).eq('id',id));await recarregar();toast('Lançamento reaberto');render()}catch(e){erro(e)}}

// ---- Equipe
VIEWS.equipe=async()=>{
  const ms=await q(sb.from('membros').select('*').eq('empresa_id',S.empresa.id));
  return `<h1>Equipe</h1><p class="sub">Dê acesso para funcionários. <b>Vendedor</b> só vende e consulta; <b>Dono</b> faz tudo.</p>
  <div class="card"><h3>Adicionar pessoa</h3><p style="color:var(--muted);margin-bottom:12px;font-size:13px">1) A pessoa abre o sistema e clica em <b>Criar conta</b> (sem cadastrar empresa). 2) Você digita o e-mail dela aqui.</p>
  <form class="f" onsubmit="event.preventDefault();addMembro(this)"><div class="c2"><label>E-mail</label><input name="email" type="email" required></div><div><label>Papel</label><select name="papel"><option value="vendedor">Vendedor</option><option value="dono">Dono</option></select></div><div style="align-self:end"><button class="btn p" style="width:100%">Adicionar</button></div></form></div>
  <div class="card tw" style="margin-top:16px"><table><tr><th>E-mail</th><th>Papel</th><th></th></tr>${ms.map(m=>`<tr><td>${esc(m.email)}${m.user_id===S.user.id?' <span class="tag t-blue">você</span>':''}</td><td>${m.papel==='dono'?'Dono':'Vendedor'}</td><td class="num">${m.user_id!==S.user.id?`<button class="btn sm d" onclick="confirmar('Remover o acesso de ${esc(m.email)}?',()=>remMembro('${m.user_id}'))">Remover</button>`:''}</td></tr>`).join('')}</table></div>`;
};
function addMembro(form){const f=Object.fromEntries(new FormData(form));busy(form.querySelector('button'),async()=>{await rpc('adicionar_membro',{p_empresa:S.empresa.id,p_email:f.email,p_papel:f.papel});toast('Acesso liberado para '+f.email);render()})}
async function remMembro(uid){try{await rpc('remover_membro',{p_empresa:S.empresa.id,p_user:uid});toast('Acesso removido');render()}catch(e){erro(e)}}

// ---- Minha conta
VIEWS.conta=()=>{
  const e=S.empresa;const st={teste:['Teste grátis','t-warn'],ativo:['Ativa','t-ok'],bloqueado:['Bloqueada','t-bad']}[e.status];
  return `<h1>Minha conta</h1><p class="sub">Dados da assinatura e do seu acesso.</p>
  <div class="grid k2"><div class="card"><h3>Assinatura</h3>
    <table><tr><td>Empresa</td><td class="num"><b>${esc(e.nome)}</b></td></tr><tr><td>Plano</td><td class="num">${esc(e.plano)}</td></tr><tr><td>Situação</td><td class="num"><span class="tag ${st[1]}">${st[0]}</span></td></tr><tr><td>Válida até</td><td class="num"><b>${DD(e.vencimento)}</b></td></tr></table>
    <a class="btn p" style="display:block;text-align:center;text-decoration:none;margin-top:14px" href="${zap('Olá! Quero '+(e.status==='teste'?'assinar':'renovar')+' o '+CONFIG.NOME_SISTEMA+' da empresa '+e.nome)}" target="_blank" rel="noopener">💬 ${e.status==='teste'?'Assinar':'Renovar'} pelo WhatsApp</a>
    <p style="color:var(--muted);font-size:12px;margin-top:8px;text-align:center">Suporte: +${esc(CONFIG.WHATSAPP_SUPORTE)}</p></div>
  <div class="card"><h3>Meu acesso</h3><p style="margin-bottom:14px">${esc(S.user.email)}<br><span style="color:var(--muted)">${S.papel==='dono'?'Dono':'Vendedor'}</span></p>
    <form class="f" style="grid-template-columns:1fr" onsubmit="event.preventDefault();trocarSenha(this)"><div><label>Nova senha</label><input name="s" type="password" minlength="6" required autocomplete="new-password"></div><button class="btn">Trocar senha</button></form>
    <button class="btn d" style="width:100%;margin-top:12px" onclick="sair()">Sair do sistema</button></div></div>`;
};
function trocarSenha(form){busy(form.querySelector('button'),async()=>{const {error}=await sb.auth.updateUser({password:form.s.value});if(error)throw error;form.reset();toast('Senha alterada')})}

// ---- Admin (você)
VIEWS.admin=async()=>{
  const l=await rpc('admin_listar');S._adm=l;
  const ativos=l.filter(e=>e.status==='ativo'&&e.vencimento>=today()).length,testes=l.filter(e=>e.status==='teste'&&e.vencimento>=today()).length,venc=l.filter(e=>e.vencimento<today()||e.status==='bloqueado').length;
  return `<h1>Admin — seus clientes</h1><p class="sub">Libere, renove ou bloqueie cada empresa. Ao receber o pagamento, clique em <b>+30 dias</b>.</p>
  <div class="grid k4"><div class="card kpi"><div class="l">Clientes ativos</div><div class="v" style="color:var(--ok)">${ativos}</div></div><div class="card kpi"><div class="l">Em teste</div><div class="v" style="color:var(--warn)">${testes}</div></div><div class="card kpi"><div class="l">Vencidos/bloqueados</div><div class="v" style="color:var(--bad)">${venc}</div></div><div class="card kpi"><div class="l">Total</div><div class="v">${l.length}</div></div></div>
  <div class="card tw" style="margin-top:16px"><table><tr><th>Empresa</th><th>Dono</th><th>Plano</th><th>Situação</th><th>Vence</th><th class="num">Vendas 30d</th><th></th></tr>
  ${l.map(e=>{const venceu=e.vencimento<today();const st=e.status==='bloqueado'?['Bloqueado','t-bad']:venceu?['Vencido','t-bad']:e.status==='teste'?['Teste','t-warn']:['Ativo','t-ok'];return `<tr><td><b>${esc(e.nome)}</b><div style="color:var(--muted);font-size:12px">${esc(e.whatsapp||'')} · ${e.usuarios} usuário(s) · ${e.produtos} produtos</div></td><td>${esc(e.dono_email||'—')}</td><td>${esc(e.plano)}</td><td><span class="tag ${st[1]}">${st[0]}</span></td><td>${DD(e.vencimento)}</td><td class="num">${e.vendas_30d}</td><td class="num" style="white-space:nowrap"><button class="btn sm p" onclick="renovar('${e.id}')">+30 dias</button> <button class="btn sm" onclick="editEmp('${e.id}')">Editar</button></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nenhum cliente ainda</td></tr>'}</table></div>`;
};
const admUpd=(e,ch)=>rpc('admin_atualizar',{p_empresa:e.id,p_status:ch.status??e.status,p_vencimento:ch.vencimento??e.vencimento,p_plano:ch.plano??e.plano});
async function renovar(id){const e=S._adm.find(x=>x.id===id);const base=e.vencimento>=today()?e.vencimento:today();try{await admUpd(e,{status:'ativo',vencimento:addDays(base,30)});toast(e.nome+' renovado até '+DD(addDays(base,30)));render()}catch(er){erro(er)}}
function editEmp(id){const e=S._adm.find(x=>x.id===id);modal(`<h3>${esc(e.nome)}</h3><form id="fem" class="f" style="grid-template-columns:1fr 1fr">
  <div><label>Situação</label><select name="status">${['teste','ativo','bloqueado'].map(s=>`<option ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></div>
  <div><label>Plano</label><select name="plano">${['basico','profissional','personalizado'].map(s=>`<option ${s===e.plano?'selected':''}>${s}</option>`).join('')}</select></div>
  <div style="grid-column:span 2"><label>Válido até</label><input name="vencimento" type="date" value="${e.vencimento}" required></div>
  <div class="row" style="grid-column:span 2"><span class="sp"></span><button type="button" class="btn" onclick="fechar()">Cancelar</button><button class="btn p" id="bem">Salvar</button></div></form>`);
  $('#fem').onsubmit=ev=>{ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target));busy($('#bem'),async()=>{await admUpd(e,f);fechar();toast('Cliente atualizado');render()})}}

// ============ INÍCIO ============
if(sb){sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>{modal(`<h3>Criar nova senha</h3><form class="f" style="grid-template-columns:1fr;margin-top:10px" onsubmit="event.preventDefault();busy(this.querySelector('button'),async()=>{const {error}=await sb.auth.updateUser({password:this.s.value});if(error)throw error;fechar();toast('Senha alterada!');carregarSessao()})"><div><label>Nova senha</label><input name="s" type="password" minlength="6" required></div><button class="btn p">Salvar nova senha</button></form>`)},300)}})}
carregarSessao().catch(erro);
</script>
</body>
</html>
